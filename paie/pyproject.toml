[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koordinpaie"
version = "0.1.0"
description = "Gestion des contrats de travail et de la paie (Côte d'Ivoire) : salariés, contrats, avenants, bulletins de paie, livre de paie"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
koordinpaie = "koordinpaie.cli:main"

[tool.setuptools.package-data]
koordinpaie = ["bareme_ci.json", "static/*"]

[tool.setuptools.packages.find]
include = ["koordinpaie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
